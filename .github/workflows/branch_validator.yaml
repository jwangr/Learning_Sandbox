name: Branch Validation Workflow

on:
  workflow_dispatch:

jobs:
  Validate_Branch:
    name: Validator Branch
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3

    - name: Validate Branch
      uses: KinsonDigital/BranchValidator@v1.0.0-preview.4 # Make sure this is the latest version
      with:
        branch-name: "${{ github.ref }}" # The current branch where the workflow is running.
        validation-logic: "matches('YAS-\\d+-[A-Za-z]+')"
        trim-from-start: "refs/heads/"
        fail-when-not-valid: false # Optional. Default is true.
    
    - name: Output Result
      if: ${{ steps.validate-branch.outputs.valid-branch }} = 'false'
      run: |
        echo "The branch name '${{ github.ref }}' is not valid. Name the branch in the format YAS-<number>-<description>."
        exit 1; # Fails the workflow