# Checks branch naming convention on pull requests?? why on pull requests?

name: Branch Name Check

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

jobs:
  check-branch-name:
    runs-on: ubuntu-latest
    steps:
      - name: Check Branch Name
        uses: actions/github-script@v6
        with:
          script: |
            const branchName = context.payload.pull_request.head.ref;
            const regex = /^YAS-[0-9]+-[A-Za-z]+$/;

            if (!regex.test(branchName)) {
              core.setFailed('Branch name does not match the required format: YAS-<NUMBER>-<description>');
            } else {
              console.log('Branch name matches the required format');
            }